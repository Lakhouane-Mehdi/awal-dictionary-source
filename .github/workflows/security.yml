name: Security & Quality Scan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Security Audit (Dependencies)
        run: npm audit --audit-level=high
        
      - name: Static Code Analysis (Lint)
        run: npm run lint
        
      - name: Check Strict Headers
        run: |
          if ! grep -q "Strict-Transport-Security" firebase.json; then
            echo "Security Error: HSTS header missing in firebase.json"
            exit 1
          fi
          echo "Security Check Passed: HSTS header present."
