name: Security & Quality Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Only shipped code can expose users. Dev-only tooling (eslint, vitest,
      # the vite dev server) never reaches the deployed bundle, and its
      # transitive advisories are often unfixable without breaking upgrades —
      # failing on those blocks real work without making the site safer.
      # Fails on any high-severity advisory in shipped code, except the
      # reviewed exceptions below. Each was checked against what actually
      # reaches the browser:
      #
      #   react-router, react-router-dom — GHSA-qwww-vcr4-c8h2 is a CSRF bypass
      #     in React Server Components' action handling. This app is a
      #     client-only SPA with no server actions, so the path is unreachable.
      #     No fixed release exists: the advisory range ends at 8.3.0, which is
      #     unpublished, so npm's only "fix" is a breaking downgrade to 7.11.0.
      #
      #   workbox-build, @surma/rollup-plugin-off-main-thread, ejs, jake,
      #   filelist, minimatch, brace-expansion — the service-worker build chain
      #     pulled in by vite-plugin-pwa. npm classes these as production
      #     because the plugin is a runtime dependency, but they execute only
      #     during `npm run build`; grepping dist/ confirms none are bundled.
      #     Overriding brace-expansion to the patched 5.x breaks ESLint, whose
      #     minimatch expects the 2.x export shape.
      #
      # Re-evaluate when react-router 8.3.0 or a fixed vite-plugin-pwa ships.
      - name: Security Audit (production dependencies)
        run: |
          npm audit --omit=dev --audit-level=high --json > audit.json || true
          UNEXPECTED=$(node -e "
            const a = require('./audit.json');
            const ALLOWED = new Set([
              'react-router', 'react-router-dom',
              'workbox-build', '@surma/rollup-plugin-off-main-thread',
              'ejs', 'jake', 'filelist', 'minimatch', 'brace-expansion',
            ]);
            const names = Object.keys(a.vulnerabilities || {}).filter(n => !ALLOWED.has(n));
            console.log(names.join(' '));
          ")
          rm -f audit.json
          if [ -n "$UNEXPECTED" ]; then
            echo "Security Error: unreviewed production vulnerabilities: $UNEXPECTED"
            npm audit --omit=dev --audit-level=high
            exit 1
          fi
          echo "Security Check Passed: no unreviewed production vulnerabilities."

      # Dev-dependency advisories are surfaced for visibility but do not fail
      # the run. Review these periodically rather than on every push.
      - name: Security Audit (all dependencies, advisory only)
        run: npm audit --audit-level=high || true

      - name: Type Check
        run: npx tsc -b

      - name: Static Code Analysis (Lint)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check Strict Headers
        run: |
          if ! grep -q "Strict-Transport-Security" firebase.json; then
            echo "Security Error: HSTS header missing in firebase.json"
            exit 1
          fi
          echo "Security Check Passed: HSTS header present."
